l<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Reseller Pro</title>

<!-- Firebase CDN -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
    font-family:sans-serif;
    background:linear-gradient(135deg,#667eea,#764ba2);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}
.container{
    width:350px;
    padding:25px;
    border-radius:20px;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(15px);
    text-align:center;
    color:white;
}
input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:none;
    border-radius:10px;
}
button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:linear-gradient(45deg,#ff6b6b,#feca57);
    color:white;
    cursor:pointer;
}
#adminPanel,#userPanel{display:none;margin-top:20px;}
.product{
    background:white;
    color:black;
    padding:10px;
    border-radius:10px;
    margin:5px 0;
}
</style>
</head>

<body>

<div class="container">
<h2>🔥 Reseller Pro</h2>

<input id="email" placeholder="Email">
<input id="pass" type="password" placeholder="Password">

<button onclick="register()">Register</button>
<button onclick="login()">Login</button>

<div id="adminPanel">
<h3>👑 Admin Panel</h3>
<input id="productName" placeholder="Product Name">
<button onclick="addProduct()">Add Product</button>
</div>

<div id="userPanel">
<h3>🛒 Products</h3>
<div id="productList"></div>
</div>

</div>

<script>

// ✅ YOUR FIREBASE CONFIG (ALREADY ADDED)
const firebaseConfig = {
  apiKey: "AIzaSyBmBtjvWp1IdDKAWDMti8BvOM_qT-awEKU",
  authDomain: "amit-sell.firebaseapp.com",
  projectId: "amit-sell",
  storageBucket: "amit-sell.firebasestorage.app",
  messagingSenderId: "149109135773",
  appId: "1:149109135773:web:919c0a11bc814abaa3b774"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// 👑 ADMIN EMAIL
const ADMIN_EMAIL = "admin@gmail.com";

// REGISTER
function register(){
 let email = document.getElementById("email").value;
 let pass = document.getElementById("pass").value;

 auth.createUserWithEmailAndPassword(email, pass)
 .then(()=> alert("✅ Account Created"))
 .catch(e=> alert(e.message));
}

// LOGIN
function login(){
 let email = document.getElementById("email").value;
 let pass = document.getElementById("pass").value;

 auth.signInWithEmailAndPassword(email, pass)
 .then(()=>{
   if(email === ADMIN_EMAIL){
     showAdmin();
   }else{
     showUser();
   }
 })
 .catch(e=> alert(e.message));
}

// ADMIN PANEL
function showAdmin(){
 document.getElementById("adminPanel").style.display="block";
 document.getElementById("userPanel").style.display="none";
}

// USER PANEL
function showUser(){
 document.getElementById("userPanel").style.display="block";
 document.getElementById("adminPanel").style.display="none";
 loadProducts();
}

// ADD PRODUCT
function addProduct(){
 let name = document.getElementById("productName").value;

 db.collection("products").add({ name:name });

 alert("🔥 Product Added");
}

// LOAD PRODUCTS
function loadProducts(){
 let list = document.getElementById("productList");
 list.innerHTML="";

 db.collection("products").get().then((data)=>{
   data.forEach(doc=>{
     let div = document.createElement("div");
     div.className="product";
     div.innerText = doc.data().name;
     list.appendChild(div);
   });
 });
}

</script>

</body>
</html>
