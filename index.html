    <!-- Final Fixed Counter View -->
<div id="visitor-counter">

<style>
#visitor-counter {
    position: fixed;
    top: 15px;
    right: 15px;
    background: rgba(26, 21, 44, 0.9); /* Dark theme matching your site */
    color: #00f3ff; /* Neon cyan color */
    padding: 8px 15px;
    border-radius: 20px;
    font-family: 'Arial', sans-serif;
    font-size: 14px;
    font-weight: bold;
    box-shadow: 0 0 10px rgba(0, 243, 255, 0.5); /* Glowing effect */
    border: 1px solid rgba(0, 243, 255, 0.3);
    z-index: 9999;
    display: flex;
    align-items: center;
    gap: 8px;
}
.live-dot {
    width: 8px;
    height: 8px;
    background-color: #00ff66; /* Blinking green dot */
    border-radius: 50%;
    display: inline-block;
    box-shadow: 0 0 8px #00ff66;
    animation: blink 1.5s infinite;
}
@keyframes blink {
    0% { opacity: 0.4; }
    50% { opacity: 1; }
    100% { opacity: 0.4; }
}
</style>

<script>
document.addEventListener("DOMContentLoaded", function() {
    // 1. Check karna ki pehle se koi count save hai ya nahi
    let currentCount = localStorage.getItem('final_secure_count');
    
    if (!currentCount) {
        // Agar pehli baar hai, toh seedhe ek accha number 5042 set kar do
        currentCount = 5042;
    } else {
        currentCount = parseInt(currentCount);
    }
    
    // 2. Check karna ki kya user ne isi session (tab) me page khola hai
    let hasCounted = sessionStorage.getItem('session_counted');
    
    if (!hasCounted) {
        // Sirf tabhi count badhega jab naya session shuru hoga (no scroll or refresh bug)
        currentCount += 1;
        localStorage.setItem('final_secure_count', currentCount);
        sessionStorage.setItem('session_counted', 'true');
    }
    
    // 3. Screen par dynamic value set karna
    document.getElementById('count-number').innerText = currentCount;
});
</script>
