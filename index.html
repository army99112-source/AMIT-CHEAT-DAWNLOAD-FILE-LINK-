#visitor-counter {

    z-index: 9999; /* Taaki ye sabse upar dikhe */
    display: flex;
    align-items: center;
    gap: 8px;
}

/* Chhota blinking green dot dynamic look ke liye */
.live-dot {
    width: 8px;
    height: 8px;
    background-color: #00ff66;
    border-radius: 50%;
    display: inline-block;
    box-shadow: 0 0 8px #00ff66;
    animation: blink 1.5s infinite;
}

@keyframes blink {
    0% { opacity: 0.4; }
    50% { opacity: 1; }
    100% { opacity: 0.4; }
}
